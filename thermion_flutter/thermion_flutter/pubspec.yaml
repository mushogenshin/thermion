name: thermion_flutter
description: Flutter plugin for 3D rendering with the Thermion toolkit.
version: 0.3.4
homepage: https://thermion.dev
repository: https://github.com/nmfisher/thermion

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.23.0-0.1.pre"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  vector_math: ^2.1.2
  plugin_platform_interface: ^2.0.0
  ffi: ^2.1.2
  thermion_dart: ^0.3.4+1
  hooks: ^1.0.0
  logging: ^1.2.0
  web: ^1.0.0
  objective_c: ^8.1.0

dependency_overrides:
  thermion_dart:
    path: ../../thermion_dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0
  ffigen: ^18.1.0

flutter:
  plugin:
    # Downstream-restricted: this branch (kineograph-desktop-only) declares
    # only macOS + Windows so Flutter's plugin discovery skips Thermion
    # native code on iOS / Android / Linux builds. Kineograph uses a
    # WebView + Three.js path on mobile and doesn't need Filament native
    # libs in the IPA / APK. The canonical multi-platform branch keeps
    # android / ios / linux entries — see the fork's other branches.
    platforms:
      macos:
        pluginClass: SwiftThermionFlutterPlugin
        sharedDarwinSource: true
      windows:
        pluginClass: ThermionFlutterPluginCApi
